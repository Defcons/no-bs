import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Version is single-sourced from package.json so every release bumps the APK.
// Android only installs an APK whose versionCode is HIGHER than the installed one,
// so a static versionCode makes new APKs silently "not update". 1.18.0 -> 11800.
def pkgVersion = new JsonSlurper().parse(file("$rootDir/../package.json")).version
def (vMajor, vMinor, vPatch) = pkgVersion.tokenize('.').collect { it.toInteger() }

// Release signing (Play upload key). Secrets live in an untracked keystore.properties
// (see keystore.properties.example). When it's absent — debug builds, CI web builds —
// release simply stays unsigned so nothing breaks.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasSigning = keystorePropsFile.exists()
if (hasSigning) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    // namespace = the Java/R package (kept as the original to avoid a package-rename
    // refactor); applicationId = the PUBLIC Play identity (net.agentas.nobs, Agentas
    // rebrand 2026-07-30, locks forever at first Play upload). They're intentionally
    // different — supported by Android; manifest relative names (.MainActivity etc.)
    // resolve against the namespace, `${applicationId}` refs use the new id.
    namespace = "no.defc0n.gymtracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.agentas.nobs"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode vMajor * 10000 + vMinor * 100 + vPatch
        versionName pkgVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two distributions from ONE codebase. Identical apart from the service below —
    // neither bakes in any user's data or credentials.
    //  - standard : what ships to Play. No AccessibilityService.
    //  - extended : sideload-only. Adds a VolumeKeyAccessibilityService (src/extended/)
    //               so a headphone volume press starts the break with the screen LOCKED
    //               and music playing — the only reliable way to do that. Play rejects
    //               non-accessibility uses of that API, which is the whole reason it
    //               can't be one build.
    // Same applicationId + debug keystore, so either upgrades the other in place.
    flavorDimensions "distribution"
    productFlavors {
        standard { dimension "distribution" }
        extended { dimension "distribution" }
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
