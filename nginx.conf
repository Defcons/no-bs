server {
    # 3060 is also the published host port (container and host port are equal). A non-default port makes nginx put
    # ":3060" into absolute redirects (a directory URL without its slash), so they are relative instead.
    listen 3060;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # NB: nginx add_header does NOT inherit — any location that sets its own
    # add_header drops these server-level headers. Keep them in the shared
    # snippet-style block below and repeat it in every location that adds headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # OTA update endpoints — the native app fetches these cross-origin (from the
    # WebView's https://localhost), so they need CORS + no caching.
    location = /version.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # no-store: a device downloads a bundle once, and Cloudflare must never keep
    # copies of retired bundles alive after a deploy replaces them.
    location ~ ^/bundle-.*\.zip$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PWA control files must never be cached, or updates won't reach the phone.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback; index.html itself stays fresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
