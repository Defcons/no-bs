name: Deploy to Production

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  # Queue, don't cancel: cancelling mid-`up -d` can leave the old container removed
  # and the new one not started.
  cancel-in-progress: false

# Jobs get no GitHub-token permissions unless they ask (only `test` reads the repo).
permissions: {}

jobs:
  # Gate: nothing reaches the box unless lint, the regression checks and the full
  # build (tsc -b + vite) pass on a clean checkout.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint src tests
      - run: npx tsx tests/audit-check.ts
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (they receive the deploy secrets); bump deliberately.
      - name: Connect to Tailscale
        uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags:            tag:ci
          version:         1.102.4

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          # The OTA bundles are world-readable (OTA requires it). VITE_APP_URL is the
          # ONLY var the build takes. Sync is configured per-device in Settings — no
          # build bakes in personal config (no VITE_SYNC_URL/SECRET/SEED in source).
          # Never reintroduce a baked-config seam.
          VITE_APP_URL:     ${{ secrets.VITE_APP_URL }}
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          port:     ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs:     VITE_APP_URL
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/nobs
            cd /opt/nobs
            git fetch origin
            git reset --hard origin/master
            export APP_VERSION="$(git rev-parse --short HEAD)"
            echo "Building OTA bundle version $APP_VERSION"
            docker compose build --no-cache
            docker compose up -d --remove-orphans
            # Health check: the new container must serve THIS build's version.json, or the
            # job fails instead of reporting green over a restart-looping container.
            for i in $(seq 1 15); do
              if docker compose exec -T nobs wget -qO- http://127.0.0.1/version.json 2>/dev/null | grep -q "+$APP_VERSION\""; then
                echo "nobs deploy complete ($APP_VERSION)"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed: version.json does not report $APP_VERSION"
            docker compose ps
            docker compose logs --tail 50 nobs
            exit 1
