name: Deploy to Production

on:
  push:
    branches: [master]
  # A manual run on another branch tests it (test and container) and deploys nothing.
  workflow_dispatch:

concurrency:
  group: deploy
  # Queue, don't cancel: cancelling mid-`up -d` can leave the old container removed
  # and the new one not started.
  cancel-in-progress: false

# Jobs get no GitHub-token permissions unless they ask (only `test` reads the repo).
permissions: {}

jobs:
  # Gate: nothing reaches the box unless lint, the regression checks and the full
  # build (tsc -b + vite) pass on a clean checkout.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint src tests
      - run: npx tsx tests/audit-check.ts
      - run: node tests/code-gs-check.cjs
      - run: npm run build

  # The image and docker-compose.yml as the box runs them: uid 101, a read-only filesystem, the app and its OTA files
  # served on 3060 and no redirect carrying the port. A container that cannot start in that shape stops the deploy
  # here, not on the box.
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the production container in its shape
        run: bash tests/container-smoke.sh

  deploy:
    needs: [test, container]
    # A manual run on another branch tests it and deploys nothing.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub's OIDC token, the tailnet login
    steps:
      # Actions pinned to full commit SHAs (they receive the deploy secrets); bump deliberately.
      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          audience:        ${{ vars.TS_OIDC_AUDIENCE }}
          tags:            tag:ci
          # The client is pinned too. To bump: a stable version and its
          # tailscale_<ver>_amd64.tgz.sha256 from https://pkgs.tailscale.com/stable/
          version:         1.102.4
          sha256sum:       50748df1045e60b5b695f19f4c56b0da36c019948b440fb456b6584a50f0d8b9

      - name: Wait for subnet routes
        run: sleep 10

      # Plain OpenSSH, so no third-party SSH binary gets the key. DEPLOY_KNOWN_HOSTS pins the box's host
      # keys, and the step stops when it is not set.
      - name: Deploy via SSH over Tailscale
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_CMD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then echo "::error::DEPLOY_KNOWN_HOSTS is not set"; exit 1; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          timeout 2400 ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=60 -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$DEPLOY_CMD"
