name: Deploy to Production

on:
  push:
    branches: [master]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags:            tag:ci
          version:         latest

      - name: Deploy via SSH over Tailscale
        uses: appleboy/ssh-action@v1
        env:
          # The OTA bundles are world-readable (OTA requires it). VITE_APP_URL is the
          # ONLY var the build takes. Sync is configured per-device in Settings — no
          # build bakes in personal config (no VITE_SYNC_URL/SECRET/SEED in source).
          # Never reintroduce a baked-config seam.
          VITE_APP_URL:     ${{ secrets.VITE_APP_URL }}
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          port:     ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          envs:     VITE_APP_URL
          script: |
            set -euo pipefail
            git config --global --add safe.directory /opt/nobs
            cd /opt/nobs
            git fetch origin
            git reset --hard origin/master
            export APP_VERSION="$(git rev-parse --short HEAD)"
            echo "Building OTA bundle version $APP_VERSION"
            docker compose build --no-cache
            docker compose up -d --remove-orphans
            echo "nobs deploy complete ($APP_VERSION)"
