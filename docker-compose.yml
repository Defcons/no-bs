services:
  gym-tracker:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        # VITE_SYNC_*/VITE_SEED forwards removed with the baked-config seam
        # (security invariant — no build bakes personal config since 1.47.0).
        VITE_APP_URL: ${VITE_APP_URL:-}
    container_name: gym-tracker
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo
    ports:
      - "3060:80" # host:container — NPM proxies app.agentas.net (+ app.codecrafts.cc alias, gym.defc0n.no retiring) here
    volumes:
      # Persistent dir for the downloadable APK, so it survives image rebuilds.
      # Served at gym.defc0n.no/dl/gym-tracker.apk
      - /apps/gym-tracker-dl:/usr/share/nginx/html/dl
