services:
  gym-tracker:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VITE_SYNC_URL: ${VITE_SYNC_URL:-}
        VITE_SYNC_SECRET: ${VITE_SYNC_SECRET:-}
        VITE_APP_URL: ${VITE_APP_URL:-}
        VITE_SEED: ${VITE_SEED:-}
    container_name: gym-tracker
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo
    ports:
      - "3060:80" # host:container — NPM proxies app.codecrafts.cc (+ gym.defc0n.no, retiring) here
    volumes:
      # Persistent dir for the downloadable APK, so it survives image rebuilds.
      # Served at gym.defc0n.no/dl/gym-tracker.apk
      - /apps/gym-tracker-dl:/usr/share/nginx/html/dl
