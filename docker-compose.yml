services:
  gym-tracker:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: gym-tracker
    restart: unless-stopped
    environment:
      - TZ=Europe/Oslo
    ports:
      - "3060:80" # host:container — NPM proxies gym.defc0n.no to this host port
    volumes:
      # Persistent dir for the downloadable APK, so it survives image rebuilds.
      # Served at gym.defc0n.no/dl/gym-tracker.apk
      - /apps/gym-tracker-dl:/usr/share/nginx/html/dl
