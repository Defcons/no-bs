services:
  nobs:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        # VITE_SYNC_*/VITE_SEED forwards removed with the baked-config seam
        # (security invariant — no build bakes personal config since 1.47.0).
        VITE_APP_URL: ${VITE_APP_URL:-}
    container_name: nobs
    restart: unless-stopped
    # Not root: nginx-unprivileged runs as uid 101, the files are read-only and /tmp (pid file, temp paths) is the only
    # writable place.
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      - TZ=Europe/Oslo
    ports:
      # host:container, the same number. Put your own reverse proxy (Caddy/NPM/Traefik) in front.
      - "3060:3060"
    volumes:
      # Persistent host dir for the downloadable APK, so it survives image rebuilds.
      # Served at <your-domain>/dl/ — host dir holding the downloadable APK
      - /opt/nobs-dl:/usr/share/nginx/html/dl
