services:
  gym-tracker:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        # VITE_SYNC_*/VITE_SEED forwards removed with the baked-config seam
        # (security invariant — no build bakes personal config since 1.47.0).
        VITE_APP_URL: ${VITE_APP_URL:-}
    container_name: gym-tracker
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "3060:80" # host:container — put your own reverse proxy (Caddy/NPM/Traefik) in front
    volumes:
      # Persistent host dir for the downloadable APK, so it survives image rebuilds.
      # Served at <your-domain>/dl/gym-tracker.apk. Point APK_DIR at your host path
      # (e.g. in a gitignored .env — Compose loads it automatically).
      - ${APK_DIR:-./apk-dl}:/usr/share/nginx/html/dl
